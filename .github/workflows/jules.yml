name: Invoke Jules

# MECANISM GENERAL - identical in every repo of the fleet.
#
# CORRECTION 2026-10-29 (Popy, masurat): Jules does NOT join on every push
# any more. He holds at most 15 tasks at the same time; beyond that he
# starts failing and stops answering. On this account there were 17 open
# sessions before the budget guard existed - over the limit, which is when
# he goes silent. So the triggers are only the ones a human means:
#   1. workflow_dispatch           -> manual, explicit task
#   2. comment containing '@jules' -> explicit request in a discussion
#   3. issue labelled 'jules'      -> explicit request with its context
#
# The push trigger and the weekly cron are GONE on purpose: the cron fired
# on all 11 repositories of the fleet in the same minute, which is a flood
# by construction, and every push consumed one of the 15 slots.
# The budget itself is enforced in .github/actions/jules - the only place
# where a session is created - so no trigger can get past it.
#
# AUTHORITY (JULES-CONTEXT.md): Jules proposes, Local decides. Pull request
# only, never a direct push to the default branch. No approval prompts:
# work, measure, open the PR. A stop comes only from a project rule,
# never from a missing human OK.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      sarcina:
        description: 'Instruction for Jules'
        required: true
        default: 'Read JULES-CONTEXT.md, then report the state of this repository. Do not build anything until you receive a concrete task.'

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write

concurrency:
  group: jules-${{ github.repository }}
  cancel-in-progress: false

jobs:
  jules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # GARD 1 - the secret must exist, otherwise the workflow burns quota
      # without sending anything to Jules. The action does its own checkout.
      - name: Guard - secret present
        env:
          KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::JULES_API_KEY is missing. Nothing is sent to Jules."
            exit 1
          fi
          echo "secret present"

      # DETECTION - a comment activates Jules only when it really contains
      # @jules (case-insensitive) and only when it comes from the repo owner.
      # A stranger must never be able to spend our quota.
      - name: Detect @jules mention
        id: mention
        if: github.event_name == 'issue_comment'
        env:
          BODY: ${{ github.event.comment.body }}
          WHO: ${{ github.event.comment.user.login }}
        run: |
          if echo "$BODY" | grep -qi '@jules' && [ "$WHO" = "apvizual-max" ]; then
            echo "hit=true" >> $GITHUB_OUTPUT
          else
            echo "hit=false" >> $GITHUB_OUTPUT
          fi

      # The action is the LOCAL one at .github/actions/jules, not
      # google-labs-code/jules-action@v1.0.0. Reason, measured 2026-10-28 in
      # this fleet: the upstream action hands its prompt to jq as a
      # command-line argument, and Linux caps a single argument at 128 KiB
      # (MAX_ARG_STRLEN). A larger prompt kills the step with
      # "/usr/bin/jq: Argument list too long" (exit 126) - and the review never
      # starts. Measured on the fleet: 4 runs failed on exactly that line, so
      # on those pushes Jules was never invoked at all and the run only LOOKED
      # like it worked. The upstream action cannot even be switched off:
      # `if: ${{ inputs.include_last_commit }}` reads the STRING "false" in a
      # composite action, and a GitHub expression reads any non-empty string as
      # true - the log shows the input echoed as false and the step running
      # anyway. The local action reads the prompt from a FILE (jq --rawfile),
      # so there is no argument to overflow, and whatever it inlines is
      # bounded and says where the whole thing can be read.
      #
      # A local action is read FROM THE WORKSPACE, so the repository has to be
      # checked out before a step that uses it. Measured 2026-10-28: with the
      # checkout inside the action, the run failed in 8 seconds with
      # "Can't find 'action.yml', 'action.yaml' or 'Dockerfile' under
      # .../.github/actions/jules". The runner resolves the action before its
      # own first step can run.
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 30

      # PAS 1 - issue labelled 'jules': a new task with its full context.
      - name: Task from the jules label
        if: contains(github.event.issue.labels.*.name, 'jules')
        uses: ./.github/actions/jules
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          max_concurrent_sessions: '15'
          prompt: |
            @jules - new task. The issue body carries the full context; read
            it entirely, do not skip it.

            Read AGENTS.md and JULES-CONTEXT.md if they exist in this repository,
            first. They carry the project rules, the invariants and the
            mandatory report format. If neither exists, follow the rules in
            this prompt and the standard agent contract.

            Issue title: ${{ github.event.issue.title }}
            Issue body:
            ${{ github.event.issue.body }}

            Work on the branch named in the issue. Open a pull request, never
            push to the default branch. Measure before you declare. If a
            verification fails, say which one and why.

      # PAS 2 - a comment with @jules: a new task, in the discussion context.
      - name: Task from an @jules comment
        if: github.event_name == 'issue_comment' && steps.mention.outputs.hit == 'true'
        uses: ./.github/actions/jules
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          max_concurrent_sessions: '15'
          prompt: |
            @jules - new task, requested in a comment.

            Read AGENTS.md and JULES-CONTEXT.md if they exist in this repository,
            first. They carry the project rules, the invariants and the
            mandatory report format. If neither exists, follow the rules in
            this prompt and the standard agent contract.

            Comment that requested the work:
            ${{ github.event.comment.body }}

            Issue title: ${{ github.event.issue.title }}
            Issue body:
            ${{ github.event.issue.body }}

            Open a pull request, never push to the default branch. Measure
            before you declare.

      # PAS 3 - manual invocation, with an instruction chosen by the caller.
      - name: Manual task
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/jules
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          max_concurrent_sessions: '15'
          prompt: |
            @jules - manual task.

            Read AGENTS.md and JULES-CONTEXT.md if they exist in this repository,
            first. They carry the project rules, the invariants and the
            mandatory report format. If neither exists, follow the rules in
            this prompt and the standard agent contract.

            Task:
            ${{ inputs.sarcina }}
